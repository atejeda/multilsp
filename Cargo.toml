[package]
name = "multilsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Several language servers behind a single LSP endpoint"
repository = "https://github.com/atejeda/multilsp"

[features]
default = ["embed"]
# Embed the pinned language servers for the target (see bundle/sources.json and build.rs).
embed = ["dep:ruzstd", "dep:sha2", "dep:tar"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ruzstd = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", optional = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3"
