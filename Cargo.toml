[package]
name = "multilsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Several language servers behind a single LSP endpoint"
repository = "https://github.com/atejeda/multilsp"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
